name: bootstrap-validation

on:
  push:
  pull_request:

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile bootstrap package
        run: python -m compileall -q src scripts
      - name: Validate project governance and references
        run: python scripts/validate_project.py
      - name: Install package with dev tooling
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
