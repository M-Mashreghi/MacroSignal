
[project]
name = "macrosignal"
version = "0.1.0"
description = "Point-in-time macro regime and cross-asset research platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=9.0",
  "python-dateutil>=2.9",
  "pytz>=2024.1",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "plotly>=5.23",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
market-demo = [
  "yfinance>=0.2.40",
]
hmm = [
  "hmmlearn>=0.3.2",
]

[project.scripts]
macrosignal = "macrosignal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/macrosignal"]
